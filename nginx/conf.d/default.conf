# DNS резолвер Docker (обязательно для работы переменных $upstream)
resolver 127.0.0.11 valid=30s ipv6=off;

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=24h max_size=1g;

# --- НАСТРОЙКА ФОРМАТА ЛОГОВ ДЛЯ FAIL2BAN ---
# Извлекает реальный IP клиента из заголовка X-Real-IP и ставит его на первое место
log_format docker_real_ip '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent"';

# --- ЗОНЫ ОГРАНИЧЕНИЯ ЧАСТОТЫ ЗАПРОСОВ ---
# Зона для обычных страниц (10 запросов в секунду на один IP)
limit_req_zone $remote_addr zone=web_limit:10m rate=10r/s;

# Зона для тяжелых API запросов (5 запросов в секунду на один IP)
limit_req_zone $remote_addr zone=api_limit:10m rate=5r/s;

# код ответа 429 (Too Many Requests) вместо стандартного 503
limit_req_status 429;

map $request_uri $is_allowed {
    default 0;

    # 1. То, что разрешено ВСЕГДА и для ВСЕХ сайтов
    "~^/$" 1;                                                            # Корень сайтов
    "~^/ntfy($|/)" 1;                                                    # Наш пуш-сервер ntfy
    "~* \.(js|css|png|jpg|jpeg|gif|svg|ico|json|woff|woff2|webmanifest)$" 1; # Вся статика фронтенда

    # 2. ПОДКЛЮЧАЕМ АВТОМАТИЧЕСКИЙ ФАЙЛ (из FastAPI volume)
    # Укажите ваш правильный путь, по которому Nginx видит этот volume
    include /etc/nginx/fastapi_shared/auto_routes.conf;

    # 3. ПОДКЛЮЧАЕМ РУЧНЫЕ ФАЙЛЫ
    include /etc/nginx/swagger_admin.conf;
    include /etc/nginx/other_apps.conf;
}

# 0. ТОТАЛЬНЫЙ СБРОС ДЛЯ ЗАПРОСОВ ПО IP (Ловушка по умолчанию)
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _; # Символ подчеркивания означает "любой неотвеченный домен или IP"

    # Подключаем заглушки сертификатов (можно использовать те же от abc8888.ru)
    ssl_certificate /etc/letsencrypt/live/abc8888.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abc8888.ru/privkey.pem;

    # Мгновенно шлем всех ботов по IP в ловушку 418!
    location / {
        return 418;
        access_log /var/log/nginx/access.log docker_real_ip;
    }
}

# 1. HTTP — Редирект на HTTPS и Certbot
server {
    listen 80;
    server_name abc8888.ru *.abc8888.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # ловить ботов до редиректа, включаем только здесь:
        include /etc/nginx/blockips.conf;
        include /etc/nginx/enable_guard.conf;
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS — ОСНОВНОЙ БЛОК (abc8888.ru)
server {
    listen 443 ssl;
    http2 on;
    server_name abc8888.ru;

    # --- ЗАПИСЬ ЛОГОВ ЭТОГО СЕРВЕРА ДЛЯ FAIL2BAN ---
    access_log /var/log/nginx/access.log docker_real_ip;

    ssl_certificate /etc/letsencrypt/live/abc8888.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abc8888.ru/privkey.pem;

    # Сжатие Gzip (как было в рабочем конфиге)
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_vary on;

    include /etc/nginx/robots_shared.conf;
    include /etc/nginx/block_scanners.conf;
    include /etc/nginx/blockips.conf;

    location ~ ^/(.well-known/)?security.txt {
        root /etc/nginx/static;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(update_item_drink|create_item_drink|seaweeds|seaweedstest) {
        set $upstream_endpoint "prod-app-1:8091";
        proxy_pass http://$upstream_endpoint;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50M;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- FRONTEND (Статика) ---
    location / {
        include /etc/nginx/enable_guard.conf;
        # Защита от DDOS на фронтенд: разрешаем всплеск до 20 запросов без задержки
        limit_req zone=web_limit burst=20 nodelay;

        set $upstream_front prod-preact_front-1;
        proxy_pass http://$upstream_front:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache STATIC;
        proxy_cache_valid 200 60m;
    }
}

# 3. HTTPS — СУБДОМЕН API (api.abc8888.ru)
server {
    listen 443 ssl;
    http2 on;
    server_name api.abc8888.ru;

    # --- ЗАПИСЬ ЛОГОВ ЭТОГО СЕРВЕРА ДЛЯ FAIL2BAN ---
    access_log /var/log/nginx/access.log docker_real_ip;

    ssl_certificate /etc/letsencrypt/live/abc8888.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abc8888.ru/privkey.pem;

    gzip on;
    gzip_types application/json;

    # --- РАЗРЕШЕНИЕ ДЛЯ SWAGGER / OPENAPI ---
    # Префикс ^~ дает этой директиве наивысший приоритет, игнорируя запреты из blockips.conf
    location ^~ /openapi.json {
        # Копируем настройки проксирования на бэкенд (как в вашем блоке с апстримом)
        set $upstream_endpoint "prod-app-1:8091";
        proxy_pass http://$upstream_endpoint;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;

        # Отключаем лимиты, если скачивается большая документация
        client_max_body_size 10M;
    }

    include /etc/nginx/robots_shared.conf;
    include /etc/nginx/block_scanners.conf;
    include /etc/nginx/blockips.conf;

    # --- КЭШИРОВАНИЕ ИЗОБРАЖЕНИЙ ---
    location ~ ^/seaweed/(direct|images)/ {
        set $upstream_app prod-app-1;
        # set $upstream_app app;
        proxy_pass http://$upstream_app:8091;

        # 1. Настройка кэширования на стороне Nginx (Server-side)
        proxy_cache STATIC;
        proxy_cache_valid 200 24h;        # Кэшировать успешные ответы на 24 часа
        proxy_cache_use_stale error timeout;
        proxy_cache_key "$host$request_uri$http_authorization"; # Важно: кэш разделен по токенам

        # Инструкции для браузера (Client-side)
        # Позволяет браузеру брать картинку из своего диска без запроса к сети
        add_header Cache-Control "public, max-age=31536000, immutable";

        # 3. Проброс заголовков
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # Убираем куки, чтобы они не мешали кэшированию статичных данных
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
    }

    # --- SEARXNG - локальный поисковик ---
    location /searxng/ {
        # Переписываем путь: убираем /searxng из URL
        rewrite ^/searxng/(.*)$ /$1 break;
        set $upstream_app searxng;
        proxy_pass http://$upstream_app:8080;

        # Стандартные заголовки для прокси
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Важно для корректной работы SearXNG
        proxy_set_header X-Original-URI $request_uri;

        # Таймауты (SearXNG может долго искать)
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Отключаем буферизацию для SSE если нужно
        proxy_buffering off;

        # CORS заголовки если понадобятся
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';

        # Кэширование не нужно для поиска
        proxy_cache off;
    }

    location / {
        include /etc/nginx/enable_guard.conf;
        set $upstream_app prod-app-1;
        # set $upstream_app app;
        proxy_pass http://$upstream_app:8091;

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_pass_header X-API-Key;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        client_max_body_size 10M;
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }
}

