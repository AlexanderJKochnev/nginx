# 7. STUB STATUS статистика сервера
server {
    listen 80;
    server_name localhost;

    # --- ЗАПИСЬ ЛОГОВ ЭТОГО СЕРВЕРА ДЛЯ FAIL2BAN ---
    access_log /var/log/nginx/access.log docker_real_ip;
    include /etc/nginx/blockips.conf;
    location /stub_status {
        stub_status on;
        access_log off;
        # Разрешаем доступ только из внутренней сети Docker
        allow 127.0.0.1;
        allow 172.16.0.0/12; # Типовой диапазон сетей Docker
        deny all;
    }
}

# 8. MATTER MOST SERVER
server {
    listen 443 ssl;
    http2 on;
    server_name mmx1.abc8888.ru;

    # --- ЗАПИСЬ ЛОГОВ ЭТОГО СЕРВЕРА ДЛЯ FAIL2BAN ---
    access_log /var/log/nginx/access.log docker_real_ip;

    ssl_certificate /etc/letsencrypt/live/abc8888.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abc8888.ru/privkey.pem;

    # Сжатие Gzip
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_vary on;

    include /etc/nginx/robots_shared.conf;
    include /etc/nginx/block_scanners.conf;
    include /etc/nginx/blockips.conf;

    location ~ ^/(.well-known/)?security.txt {
        root /etc/nginx/static;
        access_log off;
        log_not_found off;
    }

    # --- ТОЧЕЧНОЕ ИСПРАВЛЕНИЕ: Разрешаем API и Плагины ТОЛЬКО для Mattermost ---
    # Префикс ^~ дает наивысший приоритет. Сюда пойдут легитимные приложения.
    # Мы полностью копируем ваши настройки проксирования, но убираем отсюда ловушку enable_guard!
    location ^~ /(api|plugins)/ {
        set $upstream_mattermost "mattermost-app";
        proxy_pass http://$upstream_mattermost:8065;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frame-Options SAMEORIGIN;

        # WebSockets и тайм-ауты (из вашего конфига)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        client_max_body_size 100M;
        client_body_buffer_size 16k;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # --- ПРОКСИРОВАНИЕ MATTERMOST (ГЛАВНЫЙ БЛОК) ---
    location / {
        # Ловушка остается здесь! Она защитит корень сайта.
        # Если бот попытается открыть mmx1.abc8888.ru/owa/ или /1c/ — он получит 418.
        # А обычные пользователи, переходя по путям / или /login, спокойно пропустятся картой map.
        include /etc/nginx/enable_guard.conf;

        set $upstream_mattermost "mattermost-app";
        proxy_pass http://$upstream_mattermost:8065;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frame-Options SAMEORIGIN;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        client_max_body_size 100M;
        client_body_buffer_size 16k;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
