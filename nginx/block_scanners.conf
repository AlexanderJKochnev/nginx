# Общие правила блокировки сканеров для всех доменов и субдоменов
location ~* ^/(____proxy_subdomain_|v2/_catalog|ecp/|console|server-status|about|login\.action|\.env|\.DS_Store|wp-login|wp-json) {
    access_log /var/log/nginx/access.log docker_real_ip; # Логируем реальный IP для Fail2ban
    log_not_found off;
    return 404;
}
