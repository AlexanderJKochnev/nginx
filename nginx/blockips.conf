# Запрет доступа к любым скрытым файлам и папкам (.git, .env и т.д.)
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
}

# Запрет доступа к файлам конфигураций, логов, бэкапов и скриптов
location ~* \.(sh|inc|bak|cfg|sql|ini|log|yml|yaml|conf|json|txt|tpl|php|aspx|asp|jsp|cgi|pl)$ {
    deny all;
    access_log off;
}
