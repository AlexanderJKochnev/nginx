# Запрет доступа к любым скрытым файлам и папкам (.git, .env и т.д.)
# 1. Запрет скрытых файлов (.git, .env)
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
}

# 2. Запрет доступа к файлам конфигураций, логов, бэкапов и AWS
location ~* \.(sh|inc|bak|cfg|sql|ini|log|yml|yaml|conf|json|txt|tpl|php|aspx|asp|jsp|cgi|pl|aws|credentials)$ {
    deny all;
    access_log off;
}

# 3. НОВОЕ: Запрет популярных папок сканирования (включая /phpinfo/ и /phpinfo)
location ~* ^/(phpinfo|phpmyadmin|wp-admin|setup|config|admin|eval|invoker)($|/) {
    deny all;
    access_log off;
}

# 4. Запрет сканирования Microsoft Exchange / Outlook Web Access
location ~* ^/(owa|ews|autodiscover|microsoft-server-activesync|ecp|mapi|rpc|exchange)($|/) {
    deny all;
    access_log off;
}

# 5. Запрет сканирования веб-публикаций 1С:Предприятие
location ~* ^/(1c|83|v83|1c8|db|base)/ {
    deny all;
    access_log off;
}

# 6. ЛОВУШКА ДЛЯ СКАНЕРОВ (1С, Exchange, админки, cgi-bin)
location ~* ^/(1c|83|v83|1c8|db|base|owa|ews|autodiscover|microsoft-server-activesync|ecp|mapi|rpc|exchange|phpinfo|phpmyadmin|wp-admin|setup|config|admin|cgi-bin)($|/) {
    return 418;
    access_log /var/log/nginx/access.log docker_real_ip;
}
